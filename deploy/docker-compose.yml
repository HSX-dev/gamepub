# 本地开发环境。先生成密钥：go run ./tools/devkeys > .env（.env 已在 .gitignore 中）
# 启动：docker compose --env-file .env -f deploy/docker-compose.yml up -d --build
#
# 与生产的差异：AUTO_MIGRATE=true（生产使用 migrations/*.sql 经评审执行）、单节点 Kafka、无 TLS。

x-service: &service
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  restart: unless-stopped
  read_only: true
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  depends_on:
    mysql: { condition: service_healthy }
    redis: { condition: service_healthy }
    kafka-init: { condition: service_completed_successfully }

x-common-env: &common-env
  LOG_LEVEL: debug
  AUTO_MIGRATE: "true"
  DEBUG_ADDR: ":6060"
  REDIS_ADDR: redis:6379
  REDIS_PASSWORD: ${REDIS_PASSWORD:?run tools/devkeys first}
  KAFKA_BROKERS: kafka:9092
  INTERNAL_TOKEN: ${INTERNAL_TOKEN:?run tools/devkeys first}

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?run tools/devkeys first}
      ACCOUNT_DB_PASSWORD: ${ACCOUNT_DB_PASSWORD}
      WALLET_DB_PASSWORD: ${WALLET_DB_PASSWORD}
      ORDER_DB_PASSWORD: ${ORDER_DB_PASSWORD}
      TASK_DB_PASSWORD: ${TASK_DB_PASSWORD}
    volumes:
      - ./mysql/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    ports: ["127.0.0.1:3306:3306"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      retries: 30

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      retries: 30
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      retries: 30

  kafka-init:
    image: apache/kafka:3.9.1
    depends_on:
      kafka: { condition: service_healthy }
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic gamepub.order.paid --partitions 6 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic gamepub.order.paid.dlq --partitions 3 --replication-factor 1

  account:
    <<: *service
    build: { context: .., dockerfile: deploy/Dockerfile, args: { SERVICE: account } }
    environment:
      <<: *common-env
      GRPC_ADDR: ":9001"
      MYSQL_DSN: "account:${ACCOUNT_DB_PASSWORD}@tcp(mysql:3306)/gamepub_account?parseTime=true&loc=UTC&timeout=3s&readTimeout=5s&writeTimeout=5s"
      JWT_ED25519_SEED: ${JWT_ED25519_SEED}
      PII_AES_KEY: ${PII_AES_KEY}
      PHONE_PEPPER: ${PHONE_PEPPER}

  wallet:
    <<: *service
    build: { context: .., dockerfile: deploy/Dockerfile, args: { SERVICE: wallet } }
    environment:
      <<: *common-env
      GRPC_ADDR: ":9002"
      MYSQL_DSN: "wallet:${WALLET_DB_PASSWORD}@tcp(mysql:3306)/gamepub_wallet?parseTime=true&loc=UTC&timeout=3s&readTimeout=5s&writeTimeout=5s"
      RECONCILE_INTERVAL: 1m

  order:
    <<: *service
    build: { context: .., dockerfile: deploy/Dockerfile, args: { SERVICE: order } }
    environment:
      <<: *common-env
      GRPC_ADDR: ":9003"
      MYSQL_DSN: "order:${ORDER_DB_PASSWORD}@tcp(mysql:3306)/gamepub_order?parseTime=true&loc=UTC&timeout=3s&readTimeout=5s&writeTimeout=5s"
      PAY_MOCKPAY_SECRET: ${PAY_MOCKPAY_SECRET}
      DELIVERY_SIGN_SECRET: ${DELIVERY_SIGN_SECRET}

  task:
    <<: *service
    build: { context: .., dockerfile: deploy/Dockerfile, args: { SERVICE: task } }
    environment:
      <<: *common-env
      GRPC_ADDR: ":9004"
      MYSQL_DSN: "task:${TASK_DB_PASSWORD}@tcp(mysql:3306)/gamepub_task?parseTime=true&loc=UTC&timeout=3s&readTimeout=5s&writeTimeout=5s"
      WALLET_ADDR: dns:///wallet:9002

  gateway:
    <<: *service
    build: { context: .., dockerfile: deploy/Dockerfile, args: { SERVICE: gateway } }
    ports: ["127.0.0.1:8080:8080"]
    tmpfs: ["/data/uploads:uid=65532,gid=65532,mode=0750"]
    environment:
      <<: *common-env
      HTTP_ADDR: ":8080"
      JWT_ED25519_PUBLIC: ${JWT_ED25519_PUBLIC}
      ACCOUNT_ADDR: dns:///account:9001
      WALLET_ADDR: dns:///wallet:9002
      ORDER_ADDR: dns:///order:9003
      TASK_ADDR: dns:///task:9004
