# 示例：External Secrets 从 Vault 同步各服务密钥。不要 kubectl apply 明文 Secret，也不要把真实值提交到仓库。
#
# 最小权限：每个服务一份 Secret、只包含它需要的键；Deployment 只引用自己的那一份。
#   gateway : REDIS_PASSWORD, INTERNAL_TOKEN, JWT_ED25519_PUBLIC（只有公钥，无法签发令牌）
#   account : MYSQL_DSN, REDIS_PASSWORD, INTERNAL_TOKEN, JWT_ED25519_SEED, PII_AES_KEY, PHONE_PEPPER
#   wallet  : MYSQL_DSN, REDIS_PASSWORD, INTERNAL_TOKEN
#   order   : MYSQL_DSN, REDIS_PASSWORD, INTERNAL_TOKEN, PAY_MOCKPAY_SECRET, DELIVERY_SIGN_SECRET
#   task    : MYSQL_DSN, INTERNAL_TOKEN
#
# 按环境隔离：dev/staging/prod 使用不同 Vault 路径与不同密钥，生产路径仅生产集群的 ServiceAccount 可读。
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gamepub-wallet-secrets
  namespace: gamepub
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-prod
    kind: ClusterSecretStore
  target:
    name: gamepub-wallet-secrets
    creationPolicy: Owner
  data:
    - secretKey: MYSQL_DSN
      remoteRef: { key: gamepub/prod/wallet, property: mysql_dsn }
    - secretKey: REDIS_PASSWORD
      remoteRef: { key: gamepub/prod/shared, property: redis_password }
    - secretKey: INTERNAL_TOKEN
      remoteRef: { key: gamepub/prod/shared, property: internal_token }
