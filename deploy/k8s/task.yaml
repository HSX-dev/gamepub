apiVersion: v1
kind: ServiceAccount
metadata:
  name: task
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: task
  labels: { app.kubernetes.io/name: task, app.kubernetes.io/part-of: gamepub }
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels: { app.kubernetes.io/name: task }
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels: { app.kubernetes.io/name: task, app.kubernetes.io/part-of: gamepub }
    spec:
      serviceAccountName: task
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: task
          image: gamepub/task
          imagePullPolicy: IfNotPresent
          ports:
            - { name: grpc, containerPort: 9004 }
            - { name: debug, containerPort: 6060 }
          envFrom:
            - configMapRef: { name: gamepub-config }
            - secretRef: { name: gamepub-task-secrets }
          env:
            - { name: GRPC_ADDR, value: ":9004" }
          readinessProbe:
            grpc: { port: 9004 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: debug }
            periodSeconds: 10
          lifecycle:
            preStop:
              sleep: { seconds: 5 }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
---
apiVersion: v1
kind: Service
metadata:
  name: task
spec:
  clusterIP: None
  selector: { app.kubernetes.io/name: task }
  ports:
    - { name: grpc, port: 9004, targetPort: grpc }
