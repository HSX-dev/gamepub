apiVersion: v1
kind: ServiceAccount
metadata:
  name: order
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order
  labels: { app.kubernetes.io/name: order, app.kubernetes.io/part-of: gamepub }
spec:
  replicas: 3
  revisionHistoryLimit: 5
  selector:
    matchLabels: { app.kubernetes.io/name: order }
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels: { app.kubernetes.io/name: order, app.kubernetes.io/part-of: gamepub }
    spec:
      serviceAccountName: order
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: order
          image: gamepub/order
          imagePullPolicy: IfNotPresent
          ports:
            - { name: grpc, containerPort: 9003 }
            - { name: debug, containerPort: 6060 }
          envFrom:
            - configMapRef: { name: gamepub-config }
            - secretRef: { name: gamepub-order-secrets }
          env:
            - { name: GRPC_ADDR, value: ":9003" }
            - { name: OUTBOX_INTERVAL, value: 1s }
          readinessProbe:
            grpc: { port: 9003 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: debug }
            periodSeconds: 10
          lifecycle:
            preStop:
              sleep: { seconds: 5 }
          resources:
            requests: { cpu: 200m, memory: 256Mi }
            limits: { cpu: "1", memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
---
apiVersion: v1
kind: Service
metadata:
  name: order
spec:
  clusterIP: None
  selector: { app.kubernetes.io/name: order }
  ports:
    - { name: grpc, port: 9003, targetPort: grpc }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: order
spec:
  minAvailable: 2
  selector:
    matchLabels: { app.kubernetes.io/name: order }
