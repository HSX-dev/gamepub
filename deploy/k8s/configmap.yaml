# 非敏感配置。任何密钥、口令、DSN 都不得放进 ConfigMap（ConfigMap 不加密，且 RBAC 通常更宽松）。
apiVersion: v1
kind: ConfigMap
metadata:
  name: gamepub-config
data:
  LOG_LEVEL: info
  AUTO_MIGRATE: "false"
  DEBUG_ADDR: ":6060"
  RPC_TIMEOUT: 3s
  REDIS_ADDR: redis.gamepub-data.svc.cluster.local:6379
  KAFKA_BROKERS: kafka-0.kafka.gamepub-data.svc.cluster.local:9092,kafka-1.kafka.gamepub-data.svc.cluster.local:9092,kafka-2.kafka.gamepub-data.svc.cluster.local:9092
  ACCOUNT_ADDR: dns:///account.gamepub.svc.cluster.local:9001
  WALLET_ADDR: dns:///wallet.gamepub.svc.cluster.local:9002
  ORDER_ADDR: dns:///order.gamepub.svc.cluster.local:9003
  TASK_ADDR: dns:///task.gamepub.svc.cluster.local:9004
  PAY_BASE_URL: https://pay.example.com/checkout
  # 仅信任 Ingress Controller 所在网段转发的 X-Forwarded-For
  TRUSTED_PROXIES: 10.244.0.0/16
