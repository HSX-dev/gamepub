apiVersion: v1
kind: ServiceAccount
metadata:
  name: wallet
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wallet
  labels: { app.kubernetes.io/name: wallet, app.kubernetes.io/part-of: gamepub }
spec:
  replicas: 3
  revisionHistoryLimit: 5
  selector:
    matchLabels: { app.kubernetes.io/name: wallet }
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels: { app.kubernetes.io/name: wallet, app.kubernetes.io/part-of: gamepub }
    spec:
      serviceAccountName: wallet
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app.kubernetes.io/name: wallet }
      containers:
        - name: wallet
          image: gamepub/wallet
          imagePullPolicy: IfNotPresent
          ports:
            - { name: grpc, containerPort: 9002 }
            - { name: debug, containerPort: 6060 }
          envFrom:
            - configMapRef: { name: gamepub-config }
            - secretRef: { name: gamepub-wallet-secrets }
          env:
            - { name: GRPC_ADDR, value: ":9002" }
            - { name: RECONCILE_INTERVAL, value: 10m }
            - { name: DB_MAX_OPEN, value: "40" } # 副本数 × 连接数 需小于 MySQL max_connections 预留
          readinessProbe:
            grpc: { port: 9002 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: debug }
            periodSeconds: 10
          lifecycle:
            preStop:
              sleep: { seconds: 5 }
          resources:
            requests: { cpu: 200m, memory: 256Mi }
            limits: { cpu: "1", memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
---
apiVersion: v1
kind: Service
metadata:
  name: wallet
spec:
  clusterIP: None # headless：gRPC 客户端 dns:/// + round_robin 直连各 Pod，避免长连接粘在单个 Pod
  selector: { app.kubernetes.io/name: wallet }
  ports:
    - { name: grpc, port: 9002, targetPort: grpc }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: wallet
spec:
  minAvailable: 2
  selector:
    matchLabels: { app.kubernetes.io/name: wallet }
